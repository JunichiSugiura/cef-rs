[package]
name = "vmux"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "vmux"

[[bin]]
name = "vmux_helper"

[features]
# Chromium sandbox is opt-in: with default CEF + bundle layout it aborts early on macOS (e.g. fontations
# in the browser process under sandbox). Enable with `--features sandbox` when your app entitlements
# / helper layout match Chromium's expectations.
# Software OSR (`on_paint`) by default for broader macOS stability; use `--features accelerated_osr` for shared-texture OSR.
default = []
sandbox = ["cef/sandbox"]
accelerated_osr = ["cef/accelerated_osr"]
linux-x11 = ["x11-dl"]

[package.metadata.cef.bundle]
helper_name = "vmux_helper"
resources_path = "resources"
# Omit NSMainNibFile and NSPrincipalClass in the bundle plist: avoid AppKit init before Rust main.
# Cmd+Q: winit window path (window/dispatch.rs). Dock Quit: terminate on VmuxApplication.

[dependencies]
bevy_app = { version = "0.15", default-features = false }
bevy_ecs = { version = "0.15", default-features = false }
bevy_log = { version = "0.15", default-features = false }
cef = { workspace = true, features = ["build-util"] }
wgpu.workspace = true
winit = { version = "0.30" }
pollster = "0.4"
tokio = { version = "1", features = ["sync"] }
bytemuck = "1"
serde = { workspace = true, features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
bevy_render = { version = "0.15", default-features = false }
bevy_tasks = { version = "0.15", default-features = false }
# bevy_render 0.15 uses wgpu 23; used only to build a minimal `RenderContext` for `bevy_render::render_graph::Node` execution. OSR composite uses workspace wgpu 28 (`SharedGpu`).
wgpu_bevy = { package = "wgpu", version = "23" }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit = { workspace = true, features = [
    "NSApplication",
    "NSEvent",
    "NSResponder",
    "NSUserInterfaceValidation",
    "NSView",
    "NSWindow",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = { workspace = true, optional = true }
