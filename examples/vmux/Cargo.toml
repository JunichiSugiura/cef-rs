[package]
name = "vmux"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "vmux"

[[bin]]
name = "vmux_helper"

[features]
default = ["sandbox", "accelerated_osr"]
sandbox = ["cef/sandbox"]
accelerated_osr = ["cef/accelerated_osr"]
linux-x11 = ["x11-dl"]

[package.metadata.cef.bundle]
helper_name = "vmux_helper"
resources_path = "resources"

[dependencies]
cef = { workspace = true, features = ["build-util"] }
wgpu.workspace = true
winit = { version = "0.30" }
pollster = "0.4"
bytemuck = "1"
serde = { workspace = true, features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit = { workspace = true, features = [
    "NSApplication",
    "NSEvent",
    "NSResponder",
    "NSUserInterfaceValidation",
    "NSView",
    "NSWindow",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = { workspace = true, optional = true }
